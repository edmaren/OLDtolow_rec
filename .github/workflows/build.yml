name: Build tolow_rec

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tolow_rec
        uses: actions/checkout@v4

      - name: Checkout ps5-payload-dev/sdk
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-payload-sdk-src

      - name: Cache ps5-payload-sdk
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ps5-payload-sdk
          key: ps5-payload-sdk-v2-${{ hashFiles('ps5-payload-sdk-src/**') }}

      - name: Install toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20

      - name: Build & install ps5-payload-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          DESTDIR: ${{ github.workspace }}/ps5-payload-sdk
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-payload-sdk
        run: make -C ps5-payload-sdk-src install

      - name: Build libc++ / libc++abi / libunwind
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-payload-sdk
        run: ./ps5-payload-sdk-src/libcxx.sh

      - name: Build tolow_rec.elf
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-payload-sdk
        run: make clean all

      - name: Upload tolow_rec.elf
        uses: actions/upload-artifact@v4
        with:
          name: tolow_rec
          path: tolow_rec.elf
